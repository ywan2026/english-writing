<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing Studio · 송례중 3학년 영어</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a84ff'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='white'>✎</text></svg>">
<link rel="stylesheet" href="css/app.css?v=20261106b">
</head>
<body>

<!-- ===== Menu bar ===== -->
<div class="menubar">
  <div class="logo"></div>
  <div class="mi app">Writing Studio</div>
  <div class="mi" data-menu>파일
    <div class="dropdown">
      <button data-act="home">문항 목록</button>
      <hr>
      <button data-act="logout">로그아웃</button>
    </div>
  </div>
  <div class="mi" data-menu>보기
    <div class="dropdown">
      <button data-act="theme">다크 모드 켜기/끄기</button>
    </div>
  </div>
  <div class="mi admin" data-act="admin" title="교사용 관리자 모드">🔐 관리자 모드</div>
  <div class="spacer"></div>
  <div class="status" id="saveStatus"></div>
  <div class="status" id="clock"></div>
</div>

<!-- ===== Login (lock screen) ===== -->
<div class="login" id="login">
  <div class="date" id="lkDate"></div>
  <div class="time" id="lkTime"></div>
  <div class="who">
    <div class="bigav">✍️</div>
    <div class="appname">Writing Studio</div>
    <form class="lf" id="lkForm" autocomplete="off">
      <input id="lkSid" inputmode="numeric" maxlength="5" placeholder="학번 5자리 (예: 30701)" autocomplete="off">
      <input id="lkName" maxlength="12" placeholder="이름" autocomplete="off">
      <button class="go" id="lkGo" type="submit" aria-label="로그인">→</button>
    </form>
    <div class="msg" id="lkMsg"></div>
    <div class="hint">학번과 이름을 정확하게 입력하세요.<br>처음 입력한 이름으로 등록돼요.</div>
  </div>
</div>

<!-- ===== Main window ===== -->
<div class="window screen" id="win">
  <aside class="sidebar">
    <div class="traffic"><span></span><span></span><span></span></div>
    <div class="me">
      <div class="avatar" id="avatar">?</div>
      <div><div class="n" id="meName"></div><div class="s" id="meId"></div></div>
    </div>
    <nav class="nav">
      <button data-go="home" id="navHome"><span class="ico" style="background:linear-gradient(145deg,#5ac8fa,#0a84ff)">⌂</span><span class="lbl">오늘의 쓰기</span></button>
      <div class="grp">문항</div>
      <div id="navItems"></div>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main class="main">
    <div class="toolbar" id="toolbar"></div>
    <div class="content" id="content"><div class="page" id="page"></div></div>
  </main>
</div>

<!-- ===== Sheets ===== -->
<div class="scrim" id="sheet"><div class="sheet" id="sheetBox"></div></div>
<div class="loading" id="loading"><div><span class="spinner"></span><span id="loadingT">불러오는 중…</span></div></div>
<div class="toast" id="toast"><div class="ico" id="toastI" style="background:#0a84ff">✓</div><div><b id="toastT"></b><span id="toastM"></span></div></div>

<script type="module" src="js/student.js?v=20261106b"></script>
</body>
</html>
